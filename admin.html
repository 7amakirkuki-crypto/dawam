<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>رسائل لشوشه</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رسائل شوشه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3F6; --surface:#FFFFFF; --ink:#2A1E2E; --muted:#7D6A7B;
  --rose:#D3426B; --rose-soft:#F6D3DE; --line:#EADCE2;
  --gold:#D0921A; --gold-soft:#F7E6C2; --teal:#23897D; --teal-soft:#CDEBE6;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#18121B; --surface:#241B28; --ink:#F5EAF0; --muted:#A896A6;
    --rose:#F06C92; --rose-soft:#4A2636; --line:#382A3E; color-scheme:dark;
    --gold:#F0B640; --gold-soft:#4A3A1C; --teal:#4CC2B2; --teal-soft:#1C3B37;
  }
}
:root[data-theme="dark"]{
  --bg:#18121B; --surface:#241B28; --ink:#F5EAF0; --muted:#A896A6;
  --rose:#F06C92; --rose-soft:#4A2636; --line:#382A3E; color-scheme:dark;
  --gold:#F0B640; --gold-soft:#4A3A1C; --teal:#4CC2B2; --teal-soft:#1C3B37;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:1.35rem;font-weight:600;margin:0}
.lead{color:var(--muted);font-size:.9rem;margin:2px 0 18px}
textarea{display:block;width:100%;min-height:120px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:1.05rem;padding:12px 14px;resize:vertical}
.btn{width:100%;min-height:52px;margin-top:10px;border-radius:16px;border:0;background:var(--rose);color:#fff;font-weight:600;font-size:1.05rem}
.btn:disabled{opacity:.5}
.state{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:8px 0 0;text-align:center}
h2{font-size:1rem;font-weight:600;margin:26px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.msg p{flex:1;margin:0;white-space:pre-line;overflow-wrap:anywhere}
.msg small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.msg.seen small{color:var(--rose)}
.del{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:grid;place-items:center}
.del svg{width:18px;height:18px}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.live{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:22px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.88rem;font-weight:600;background:var(--line);color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.live.work .chip{background:var(--rose-soft);color:var(--rose)}
.live.break .chip{background:var(--teal-soft);color:var(--teal)}
.live.back .chip{background:var(--gold-soft);color:var(--gold)}
.live.work .chip i,.live.break .chip i,.live.back .chip i{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.timer{font-size:clamp(2.4rem,13vw,3.2rem);font-weight:600;line-height:1.1;margin:10px 0 2px;direction:ltr;font-variant-numeric:tabular-nums}
.timer small{font-size:.45em;opacity:.6}
.lsub{margin:0;color:var(--muted);font-size:.92rem}
.bar{height:8px;border-radius:99px;background:var(--line);margin:12px 4px 0;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--rose);border-radius:99px;transition:width .6s ease}
.live.break .bar b{background:var(--teal)}
.seen-at{margin:10px 0 0;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>رسائل لشوشه 🤍</h1>
  <p class="lead">اللي تكتبه هنا يطلعلها بدوامي، ويبقى لحد ما تدوس على القلب.</p>

  <section class="live" id="live" aria-live="polite">
    <span class="chip"><i></i><span id="lChip">…</span></span>
    <div class="timer" id="lTimer">--:--</div>
    <p class="lsub" id="lSub"></p>
    <div class="bar"><b id="lBar"></b></div>
    <p class="seen-at" id="lSeen"></p>
  </section>

  <label for="body" style="display:block;font-weight:600;margin-bottom:6px">رسالة جديدة</label>
  <textarea id="body" maxlength="2000" placeholder="اكتبلها شي حلو…"></textarea>
  <button class="btn" id="send">دز الرسالة</button>
  <p class="state" id="state" role="status"></p>

  <h2>تنتظر تشوفها</h2>
  <div class="list" id="waiting"></div>

  <h2>شافتها ودست على القلب</h2>
  <div class="list" id="seen"></div>
</div>

<script>
const SUPABASE_URL = "https://ttdmnxsatgrnpuawhbyp.supabase.co";
const SUPABASE_KEY = "sb_publishable_fhgalEOVWNyWMYU4qB3Dbg_64xqoJ-Y";
const $ = id => document.getElementById(id);
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

function rest(path, opt){
  opt = opt || {};
  return fetch(SUPABASE_URL+"/rest/v1/"+path, {method:opt.method||"GET", body:opt.body,
    headers:{"Content-Type":"application/json", apikey:SUPABASE_KEY}})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text().then(t => t ? JSON.parse(t) : null); });
}
const when = iso => new Date(iso).toLocaleString("ar-IQ",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});

function item(m){
  const row = document.createElement("div"); row.className = "msg" + (m.hearted_at ? " seen" : "");
  const p = document.createElement("p"); p.textContent = m.body;
  const s = document.createElement("small");
  s.textContent = m.hearted_at ? "❤️ " + when(m.hearted_at) : "انكتبت " + when(m.created_at);
  p.appendChild(s);
  const d = document.createElement("button"); d.className = "del"; d.innerHTML = TRASH; d.setAttribute("aria-label","امسح الرسالة");
  d.onclick = () => { if(confirm("تمسح هاي الرسالة؟")) rest("dawam_messages?id=eq."+m.id, {method:"DELETE"}).then(load).catch(()=> $("state").textContent = "ما انمسحت، جرب مرة ثانية"); };
  row.append(p, d); return row;
}
function fill(id, rows, emptyText){
  const box = $(id); box.innerHTML = "";
  if(!rows.length){ const e = document.createElement("p"); e.className = "empty"; e.textContent = emptyText; box.appendChild(e); return; }
  rows.forEach(m => box.appendChild(item(m)));
}
function load(){
  return rest("dawam_messages?select=id,body,created_at,hearted_at&order=created_at.desc&limit=200").then(rows => {
    fill("waiting", rows.filter(m => !m.hearted_at), "ماكو رسائل تنتظر.");
    fill("seen", rows.filter(m => m.hearted_at), "بعد ما داست على أي قلب.");
  }).catch(()=> $("state").textContent = "ما گدرت أجيب الرسائل، تأكد من الإنترنت");
}
$("send").onclick = () => {
  const body = $("body").value.trim(); if(!body) return;
  $("send").disabled = true; $("state").textContent = "";
  rest("dawam_messages", {method:"POST", body:JSON.stringify({body})})
    .then(() => { $("body").value = ""; $("state").textContent = "وصلت، راح تطلعلها من تفتح دوامي 🤍"; return load(); })
    .catch(() => $("state").textContent = "ما وصلت، جرب مرة ثانية")
    .finally(() => $("send").disabled = false);
};
/* ===== Her live status, worked out from the shared copy the app saves (same rules as index.html) ===== */
const MIN = 60000, HOUR = 60*MIN, SHARED = "dawam-shared-main";
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt = ms => { const m = Math.max(0,Math.round(ms/MIN)); return Math.floor(m/60)+":"+pad(m%60); };
const clock = ms => { const s = Math.max(0,Math.floor(ms/1000)); return Math.floor(s/3600)+":"+pad(Math.floor(s/60)%60)+"<small>"+pad(s%60)+"</small>"; };
const hhmm = t => new Date(t).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"});
let her = null;
function win(k){
  const [y,m,d] = k.split("-").map(Number);
  return [new Date(y,m-1,d,her.winStart??8).getTime(), new Date(y,m-1,d,her.winEnd??20).getTime()];
}
const clipW = (a,b,w) => Math.max(0, Math.min(b,w[1]) - Math.max(a,w[0]));
function status(){
  const now = Date.now(), today = dkey(new Date());
  let L = her.live ? Object.assign({}, her.live) : null;
  /* her app may be closed: apply the same automatic steps it would */
  if(L && L.mode==="break" && now >= L.brkStart + L.brkPlan) L = {date:L.date, mode:"work", segStart:L.brkStart + L.brkPlan};
  const k = L ? L.date : today, d = (her.days||{})[k], w = win(k);
  const planned = (d && d.planned) || (her.regular||5)*HOUR;
  let worked = d ? (d.manual != null ? d.manual : (d.segs||[]).reduce((a,s)=>a+clipW(s[0],s[1],w),0)) : 0;
  if(L && L.mode==="work") worked += clipW(L.segStart, now, w);
  if(L && L.mode==="work" && worked >= planned){ worked = planned; L = null; }  /* the day closes once her hours are done */
  if(L && now >= w[1]) L = null;
  if(!L){
    const done = d ? (d.reg != null ? d.reg + (d.ot||0) : worked) : 0;
    return done > 0 ? {cls:"off", chip:"خلصت دوام اليوم", timer:clock(done), sub: d && d.ot ? "منها إضافي +"+fmt(d.ot) : "يعطيها العافية", frac:1}
                    : {cls:"off", chip:"بعدها ما بدأت الدوام", timer:"0:00", sub:"الدوام ينحسب من "+(her.winStart??8)+":00 لحد "+(her.winEnd??20)+":00", frac:0};
  }
  if(L.mode==="break"){
    const left = L.brkStart + L.brkPlan - now;
    return {cls:"break", chip:"استراحة", timer:clock(left), sub:"ترجع للدوام الساعة "+hhmm(L.brkStart+L.brkPlan)+" · اشتغلت "+fmt(worked), frac:(now-L.brkStart)/L.brkPlan};
  }
  const back = d && (d.segs||[]).length && now - L.segStart < 15*MIN;
  const sub = now < w[0] ? "الحساب يبدأ الساعة "+(her.winStart??8)+":00"
            : worked < planned ? "باقي "+fmt(planned-worked)+" من "+fmt(planned) : "كملت ساعاتها، هسه إضافي +"+fmt(worked-planned);
  return {cls: back ? "back" : "work", chip: back ? "رجعت من الاستراحة" : "بالدوام", timer:clock(worked), sub, frac:worked/planned};
}
function renderLive(){
  if(!her) return;
  const v = status();
  $("live").className = "live " + v.cls;
  $("lChip").textContent = v.chip; $("lTimer").innerHTML = v.timer; $("lSub").textContent = v.sub;
  $("lBar").style.width = Math.min(100, Math.max(0, v.frac*100)) + "%";
  $("lSeen").textContent = her.updatedAt > 1 ? "آخر تحديث من موبايلها: " + hhmm(her.updatedAt) : "";
}
function loadHer(){
  return rest("rpc/dawam_get", {method:"POST", body:JSON.stringify({p_code:SHARED})})
    .then(d => { if(d) { her = d; renderLive(); } else { $("lChip").textContent = "بعد ماكو بيانات"; } })
    .catch(() => { $("lSub").textContent = "ما گدرت أجيب حالتها، تأكد من الإنترنت"; });
}

document.addEventListener("visibilitychange", () => { if(!document.hidden){ load(); loadHer(); } });
load(); loadHer();
setInterval(renderLive, 1000);
setInterval(loadHer, 20000);
</script>
</body>
</html>
